spring.application.name=api-gateway

server.port=8080


# ==============================
# Auth Service
# ==============================

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**


# ==============================
# Student Service
# ==============================

spring.cloud.gateway.routes[1].id=student-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/student/**


# ==============================
# Placement Service
# ==============================

spring.cloud.gateway.routes[2].id=placement-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/jobs/**


# ==============================
# Company APIs
# ==============================

spring.cloud.gateway.routes[3].id=company-service
spring.cloud.gateway.routes[3].uri=http://localhost:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/company/**


# ==============================
# Admin APIs
# ==============================

spring.cloud.gateway.routes[4].id=admin-service
spring.cloud.gateway.routes[4].uri=http://localhost:8083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admin/**