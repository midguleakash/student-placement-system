
spring.application.name=api-gateway
server.port=8080

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Student Service
spring.cloud.gateway.server.webflux.routes[1].id=student-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/student/**

# Placement Service
spring.cloud.gateway.server.webflux.routes[2].id=placement-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/jobs/**

# Company APIs
spring.cloud.gateway.server.webflux.routes[3].id=company-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/company/**

# Admin APIs
# Admin student management -> Student Service
spring.cloud.gateway.server.webflux.routes[4].id=admin-student-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/admin/students/**

# Admin company management -> Placement Service
spring.cloud.gateway.server.webflux.routes[5].id=admin-company-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/admin/companies/**

# CORS
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns[0]=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns[1]=https://hoppscotch.io

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[1]=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[2]=Accept

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=false